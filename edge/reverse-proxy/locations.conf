# Escenario 2 · rutas públicas del Reverse Proxy: /api, /ws, /admin/*, /health -> API Gateway; resto -> cliente web (repo joker-arena-frontend).
# Los destinos son los grupos upstream de nginx.conf (keepalive + resolve): nginx arranca aunque el
# frontend no esté levantado y reutiliza las conexiones hacia el gateway.

location ^~ /api {
    set $gateway http://gateway_up;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $gateway;
}

location ^~ /ws {
    set $gateway http://gateway_up;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $gateway;
}

location = /admin {
    set $web http://web_up;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $web;
}

location = /admin/ {
    set $web http://web_up;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $web;
}

location ^~ /admin/ {
    set $gateway http://gateway_up;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $gateway;
}

location = /health {
    set $gateway http://gateway_up;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $gateway;
}

location / {
    set $web http://web_up;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $web;
}
