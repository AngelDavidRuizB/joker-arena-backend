# Escenario 2 · rutas públicas del Reverse Proxy: /api, /ws, /admin/*, /health -> API Gateway; resto -> cliente web (repo joker-arena-frontend).
# Los upstream van en variables: nginx arranca aunque el frontend no esté levantado (resolver de Docker).

location ^~ /api {
    set $gateway http://jokerarena-gateway:8080;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $gateway;
}

location ^~ /ws {
    set $gateway http://jokerarena-gateway:8080;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $gateway;
}

location = /admin {
    set $web http://jokerarena-web-ssr:3000;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $web;
}

location = /admin/ {
    set $web http://jokerarena-web-ssr:3000;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $web;
}

location ^~ /admin/ {
    set $gateway http://jokerarena-gateway:8080;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $gateway;
}

location = /health {
    set $gateway http://jokerarena-gateway:8080;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $gateway;
}

location / {
    set $web http://jokerarena-web-ssr:3000;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $web;
}
