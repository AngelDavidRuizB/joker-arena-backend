# ==============================================================================
# JokerArena P3 · Escenario 1 (Secure Channel)
# Redirección HTTP -> HTTPS (80 -> 443) y terminación TLS para HTTPS y WSS.
# Se incluye desde edge/reverse-proxy/nginx.conf junto con locations.conf.
# ==============================================================================

server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:TLS:10m;
    ssl_session_timeout       10m;
    ssl_session_tickets       off;

    # HSTS (Escenario 1 - Secure Channel).
    # Nota de integración con Escenario 2: en nginx, add_header en server{}
    # reemplaza los add_header heredados de http{}; al integrar con nginx.conf
    # de Esteban, verificar con `curl -I` que coexistan HSTS y las cabeceras de seguridad.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/locations.conf;
}
