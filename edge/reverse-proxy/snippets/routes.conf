location = /__edge_health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location ^~ /api {
    set $gateway http://jokerarena-gateway-edge:8080;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $gateway;
}

location ^~ /ws {
    set $gateway http://jokerarena-gateway-edge:8080;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $gateway;
}

location = /admin {
    set $web http://jokerarena-web-ssr:3000;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $web;
}

location = /admin/ {
    set $web http://jokerarena-web-ssr:3000;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $web;
}

location ^~ /admin/ {
    set $gateway http://jokerarena-gateway-edge:8080;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $gateway;
}

location = /health {
    set $gateway http://jokerarena-gateway-edge:8080;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $gateway;
}

location / {
    set $web http://jokerarena-web-ssr:3000;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_pass $web;
}
