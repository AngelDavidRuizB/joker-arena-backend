# ==============================================================================
# JokerArena P3 · Reverse Proxy (Escenario 2) — único punto de entrada público.
# Publica 80/443 en el host; reenvía al API Gateway y al cliente web por edge-net.
# ==============================================================================
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    log_format edge '$remote_addr "$request_method $uri $server_protocol" $status '
                    '$body_bytes_sent ${request_time}s -> $upstream_addr';
    access_log /dev/stdout edge;
    error_log  /dev/stderr warn;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;
    client_max_body_size 64k;
    client_body_timeout 15s;
    send_timeout 30s;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Escenario 1 (Secure Channel): 80 -> 301 HTTPS y terminación TLS en 443.
    # Escenario 2 (Reverse Proxy): rutas en /etc/nginx/locations.conf.
    include /etc/nginx/conf.d/*.conf;
}
