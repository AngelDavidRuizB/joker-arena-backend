# ==============================================================================
# JokerArena P3 · Reverse Proxy (Escenario 2) — único punto de entrada público.
# Publica 80/443 en el host; reenvía al API Gateway y al cliente web por edge-net.
# ==============================================================================
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    log_format edge '$remote_addr "$request_method $uri $server_protocol" $status '
                    '$body_bytes_sent ${request_time}s -> $upstream_addr';
    access_log /dev/stdout edge;
    error_log  /dev/stderr warn;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;
    client_max_body_size 64k;
    client_body_timeout 15s;
    send_timeout 30s;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Conexiones reutilizables (keepalive) hacia el gateway y la web. Con proxy_pass a
    # un nombre de host en variable, nginx abre una conexión TCP nueva por petición;
    # cada una deja el puerto 60 s en TIME_WAIT y, con ~28.000 puertos efímeros, por
    # encima de ~940 peticiones/s el proxy responde 502/503 ("connect() failed (99:
    # Address not available)"). Es el mismo problema que tenía el gateway; ver
    # docs/p3/rendimiento/http.md. "resolve" (nginx >= 1.27.3) mantiene lo que daban las
    # variables: nginx arranca aunque la web no esté levantada y sigue el DNS de Docker.
    upstream gateway_up { zone gateway_up 64k; server jokerarena-gateway:8080 resolve; keepalive 64; keepalive_timeout 30s; }
    upstream web_up     { zone web_up 64k;     server jokerarena-web-ssr:3000 resolve; keepalive 16; keepalive_timeout 4s; }

    # Escenario 1 (Secure Channel): 80 -> 301 HTTPS y terminación TLS en 443.
    # Escenario 2 (Reverse Proxy): rutas en /etc/nginx/locations.conf.
    include /etc/nginx/conf.d/*.conf;
}
