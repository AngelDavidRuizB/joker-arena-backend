<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker>
<marker id="arrS" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker>
</defs>
<rect width="1400" height="640" fill="#fff"/>
<text x="700" y="32" text-anchor="middle" font-size="22" font-weight="bold">Funcionalidad 1 — Gestión de salas y jugadores</text>
<text x="700" y="56" text-anchor="middle" font-size="13" fill="#555">Creación/unión a salas (código alfanumérico, 2 a 4 jugadores), modo Bot y registro de jugadores/partidas</text>
<g transform="translate(40,600)" font-size="11"><rect x="0" y="-9" width="10" height="10" fill="#fff" stroke="#222" stroke-width="2"/><text x="16" y="0">Puerto</text>
<line x1="70" y1="-4" x2="110" y2="-4" stroke="#222" stroke-width="2" marker-end="url(#arr)"/><text x="116" y="0">Conector</text>
<line x1="190" y1="-4" x2="230" y2="-4" stroke="#222" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arr)"/><text x="236" y="0">Conector asíncrono / streaming</text></g>
<rect x="40" y="110" width="300" height="217" rx="8" fill="#dbeafe" stroke="#2a5d9f" stroke-width="2"/>
<text x="190.0" y="132" text-anchor="middle" font-size="13">«component»</text>
<text x="190.0" y="152" text-anchor="middle" font-size="16" font-weight="bold">Web Frontend Client</text>
<text x="190.0" y="169" text-anchor="middle" font-size="12">TypeScript / React (:3000)</text>
<text x="54" y="245" font-size="12">• components/Lobby (crear / unirse a sala)</text>
<text x="54" y="263" font-size="12">• services/api (cliente REST)</text>
<text x="54" y="281" font-size="12">• hooks/ (conexión WebSocket)</text>
<text x="54" y="299" font-size="12">• state/ y types/ (ROOM_STATE_UPDATE)</text>
<rect x="332" y="162" width="16" height="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="326" y="174" text-anchor="end" font-size="11">p_rest_out</text>
<rect x="332" y="202" width="16" height="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="326" y="214" text-anchor="end" font-size="11">p_ws_io</text>
<rect x="520" y="110" width="380" height="235" rx="8" fill="#dcfce7" stroke="#2b7a2b" stroke-width="2"/>
<text x="710.0" y="132" text-anchor="middle" font-size="13">«component»</text>
<text x="710.0" y="152" text-anchor="middle" font-size="16" font-weight="bold">Game Engine &amp; Session Manager</text>
<text x="710.0" y="169" text-anchor="middle" font-size="12">Go (:8080)</text>
<text x="534" y="245" font-size="12">• internal/api — handlers REST (salas, /health)</text>
<text x="534" y="263" font-size="12">• internal/ws — conexiones y broadcast de sala</text>
<text x="534" y="281" font-size="12">• internal/room — Session Manager (goroutine/sala,</text>
<text x="534" y="299" font-size="12">   código único, 2-4 jugadores, modo Bot)</text>
<text x="534" y="317" font-size="12">• internal/store — acceso a PostgreSQL (pgx)</text>
<rect x="512" y="162" width="16" height="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="534" y="174" font-size="11">p_rest_srv</text>
<rect x="512" y="202" width="16" height="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="534" y="214" font-size="11">p_ws_srv</text>
<rect x="892" y="162" width="16" height="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="886" y="174" text-anchor="end" font-size="11">p_sql_out</text>
<rect x="1090" y="110" width="250" height="181" rx="8" fill="#ffedd5" stroke="#a86a12" stroke-width="2"/>
<text x="1215.0" y="132" text-anchor="middle" font-size="13">«datastore»</text>
<text x="1215.0" y="152" text-anchor="middle" font-size="16" font-weight="bold">PostgreSQL</text>
<text x="1215.0" y="169" text-anchor="middle" font-size="12">SQL relacional ACID (:5432)</text>
<text x="1104" y="245" font-size="12">• players (cuentas, total_victories)</text>
<text x="1104" y="263" font-size="12">• matches (registro de partidas)</text>
<rect x="1082" y="162" width="16" height="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="1104" y="174" font-size="11">p_sql_in</text>
<polyline points="348,170 512,170" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="430.0" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#b00020">C1 · HTTP REST (JSON)</text>
<text x="430.0" y="168" text-anchor="middle" font-size="11" fill="#444">crear / consultar / unirse a sala</text>
<polyline points="348,210 512,210" fill="none" stroke="#222" stroke-width="2" marker-start="url(#arrS)" marker-end="url(#arr)"/>
<text x="430.0" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#b00020">C2 · WebSocket</text>
<text x="430.0" y="208" text-anchor="middle" font-size="11" fill="#444">ROOM_STATE_UPDATE a la sala</text>
<polyline points="908,170 1082,170" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="995.0" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#b00020">C5 · TCP nativo PostgreSQL</text>
<text x="995.0" y="168" text-anchor="middle" font-size="11" fill="#444">pool pgx: players, matches</text>
<rect x="40" y="380" width="860" height="78" fill="#fffde7" stroke="#bba800"/>
<text x="50" y="399" font-size="11.5" font-weight="bold">Flujo (pasos 1-2 de 4.5)</text>
<text x="50" y="415" font-size="11.5">1. El jugador crea la sala con «Simular Oponente (Bot)» por C1 y recibe su código alfanumérico.</text>
<text x="50" y="431" font-size="11.5">2. El cliente abre el WebSocket (C2); el Session Manager registra al jugador y difunde el estado de la sala.</text>
<text x="50" y="447" font-size="11.5">3. Al concluir la partida, el Game Engine registra el resultado en matches y actualiza total_victories (C5).</text>
</svg>
