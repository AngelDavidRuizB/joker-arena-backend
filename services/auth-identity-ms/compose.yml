# auth-identity-ms (Esteban Andrés Gómez Álvarez) · incluido desde docker-compose.p2.yml
services:
  jokerarena-auth-identity-ms:
    build: .
    container_name: jokerarena-auth-identity-ms
    restart: unless-stopped
    environment:
      PORT: 8082
      POSTGRES_URL: postgresql://svc_auth:${AUTH_DB_PASSWORD}@jokerarena-postgres:5432/${POSTGRES_DB:-jokerarena}
      REDIS_URL: redis://jokerarena-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-jokerarena}:${RABBITMQ_PASSWORD}@jokerarena-rabbitmq:5672/
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env}
      JWT_KEY_FILE: /data/jwt_private_key.pem
    volumes:
      - p2-authkeys:/data
    depends_on:
      jokerarena-postgres:
        condition: service_healthy
      jokerarena-redis:
        condition: service_healthy
      jokerarena-rabbitmq:
        condition: service_healthy
    networks: [jokerarena-net]

networks:
  jokerarena-net:
    name: jokerarena-net

volumes:
  p2-authkeys:
