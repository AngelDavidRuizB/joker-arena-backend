# game-engine-ms (Santiago Zamora Garzon) · incluido desde docker-compose.p2.yml
services:
  jokerarena-game-engine-ms:
    build: .
    container_name: jokerarena-game-engine-ms
    restart: unless-stopped
    environment:
      PORT: 8081
      STORAGE_MODE: postgres
      # El DSN se compone en código con url.UserPassword (codifica '@' y otros
      # caracteres del user/password), por lo que GAME_DB_PASSWORD puede contenerlos.
      DB_HOST: jokerarena-postgres
      DB_PORT: 5432
      DB_USER: svc_game
      DB_PASSWORD: ${GAME_DB_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-jokerarena}
      DB_SSLMODE: disable
      # Igual que PostgreSQL, el URL AMQP se compone en código (url.UserPassword),
      # por lo que RABBITMQ_PASSWORD puede contener caracteres especiales.
      RABBITMQ_HOST: jokerarena-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-jokerarena}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AUTH_JWKS_URL: http://jokerarena-auth-identity-ms:8082/.well-known/jwks.json
      ROOMS_LOBBY_URL: http://jokerarena-rooms-lobby-ms:8083
      LIVEOPS_URL: http://jokerarena-liveops-rules-ms:8087
      BOT_AI_URL: http://jokerarena-bot-ai-ms:8084
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ROOM_IDLE_TIMEOUT: ${ROOM_IDLE_TIMEOUT:-15m}
    depends_on:
      jokerarena-postgres:
        condition: service_healthy
      jokerarena-rabbitmq:
        condition: service_healthy
    networks: [jokerarena-net]

networks:
  jokerarena-net:
    name: jokerarena-net
