[package]
name = "bot-ai-ms"
version = "1.0.0"
edition = "2021"
rust-version = "1.83"
description = "JokerArena P2 - decisión del oponente bot (jugar o descartar)"

[dependencies]
axum = "=0.7.9"
tokio = { version = "=1.42.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.134"

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }
http-body-util = "=0.1.2"

[profile.release]
strip = true
lto = true
