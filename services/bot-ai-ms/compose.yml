# bot-ai-ms (Juan David Suárez Coronado) · incluido desde docker-compose.p2.yml
# Escenario 3: Contenedor conectado únicamente a app-net (principio de mínimo privilegio).
# Aislado de bases de datos (pg-net, redis-net, mongo-net, neo4j-net) y colas (broker-net).
services:
  jokerarena-bot-ai-ms:
    build: .
    container_name: jokerarena-bot-ai-ms
    restart: unless-stopped
    environment:
      PORT: 8084
    networks:
      - app-net

networks:
  app-net:
    name: app-net
