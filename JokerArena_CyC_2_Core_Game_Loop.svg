<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker>
<marker id="arrS" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker>
</defs>
<rect width="1400" height="680" fill="#fff"/>
<text x="700" y="32" text-anchor="middle" font-size="22" font-weight="bold">Funcionalidad 2 — Core Game Loop (motor de juego)</text>
<text x="700" y="56" text-anchor="middle" font-size="13" fill="#555">Baraja de 52 cartas, selección/descarte de hasta 5 cartas, reconocimiento de manos y puntaje Chips × Mult (servidor autoritativo)</text>
<g transform="translate(40,640)" font-size="11"><rect x="0" y="-9" width="10" height="10" fill="#fff" stroke="#222" stroke-width="2"/><text x="16" y="0">Puerto</text>
<line x1="70" y1="-4" x2="110" y2="-4" stroke="#222" stroke-width="2" marker-end="url(#arr)"/><text x="116" y="0">Conector</text>
<line x1="190" y1="-4" x2="230" y2="-4" stroke="#222" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arr)"/><text x="236" y="0">Conector asíncrono / streaming</text></g>
<rect x="40" y="110" width="300" height="235" rx="8" fill="#dbeafe" stroke="#2a5d9f" stroke-width="2"/>
<text x="190.0" y="132" text-anchor="middle" font-size="13">«component»</text>
<text x="190.0" y="152" text-anchor="middle" font-size="16" font-weight="bold">Web Frontend Client</text>
<text x="190.0" y="169" text-anchor="middle" font-size="12">TypeScript / React (:3000)</text>
<text x="54" y="245" font-size="12">• components/ (Tapete, Mano, Cartas)</text>
<text x="54" y="263" font-size="12">• botones «Jugar Mano» / «Descartar»</text>
<text x="54" y="281" font-size="12">• hooks/ (conexión WebSocket)</text>
<text x="54" y="299" font-size="12">• state/ y types/ (PLAY_HAND,</text>
<text x="54" y="317" font-size="12">   DISCARD_CARDS, ROOM_STATE_UPDATE)</text>
<rect x="332" y="172" width="16" height="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="326" y="184" text-anchor="end" font-size="11">p_ws_io</text>
<rect x="520" y="110" width="380" height="235" rx="8" fill="#dcfce7" stroke="#2b7a2b" stroke-width="2"/>
<text x="710.0" y="132" text-anchor="middle" font-size="13">«component»</text>
<text x="710.0" y="152" text-anchor="middle" font-size="16" font-weight="bold">Game Engine &amp; Session Manager</text>
<text x="710.0" y="169" text-anchor="middle" font-size="12">Go (:8080) — servidor autoritativo</text>
<text x="534" y="245" font-size="12">• internal/ws — recepción de acciones y broadcast</text>
<text x="534" y="263" font-size="12">• internal/room — estado de ronda, descartes y manos</text>
<text x="534" y="281" font-size="12">• internal/deck — generación, barajado y reparto</text>
<text x="534" y="299" font-size="12">• internal/evaluator — reconocimiento de manos</text>
<text x="534" y="317" font-size="12">• internal/scoring — pipeline Chips × Mult</text>
<rect x="512" y="172" width="16" height="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="534" y="184" font-size="11">p_ws_srv</text>
<polyline points="348,180 512,180" fill="none" stroke="#222" stroke-width="2" marker-start="url(#arrS)" marker-end="url(#arr)"/>
<text x="430.0" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#b00020">C2 · WebSocket (RFC 6455)</text>
<text x="430.0" y="178" text-anchor="middle" font-size="11" fill="#444">PLAY_HAND / DISCARD_CARDS  ⇄  ROOM_STATE_UPDATE</text>
<rect x="40" y="400" width="860" height="94" fill="#fffde7" stroke="#bba800"/>
<text x="50" y="419" font-size="11.5" font-weight="bold">Flujo (pasos 3-5 de 4.5)</text>
<text x="50" y="435" font-size="11.5">1. El jugador selecciona hasta 5 cartas y envía PLAY_HAND o DISCARD_CARDS por C2.</text>
<text x="50" y="451" font-size="11.5">2. El Game Engine valida la acción, reconoce la mano (Carta Alta … Escalera Real) y calcula el puntaje.</text>
<text x="50" y="467" font-size="11.5">3. Difunde ROOM_STATE_UPDATE a todos los jugadores; el cliente solo renderiza (no valida reglas).</text>
<text x="50" y="483" font-size="11.5">Puntaje = Fichas Totales × Multiplicador Total</text>
</svg>
