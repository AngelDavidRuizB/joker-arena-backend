<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Vista C&amp;C — JokerArena Prototipo 1</title>
  <desc id="d">Frontend React conectado por REST y WebSocket al servicio de juego en Go y por REST y SSE al servicio de telemetría en Python. El servicio de juego envía jugadas por gRPC a telemetría. Go usa PostgreSQL y Python usa MongoDB. Todo desplegado con Docker Compose.</desc>

  <defs>
    <marker id="mRest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="mWs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="mSse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="mGrpc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="mDb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>

  <rect width="1200" height="830" fill="#ffffff"/>

  <!-- Actor -->
  <rect x="510" y="22" width="180" height="52" rx="26" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Jugador</text>
  <text x="600" y="62" text-anchor="middle" font-size="12" fill="#475569">Navegador web</text>
  <line x1="600" y1="74" x2="600" y2="158" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mDb)"/>
  <text x="610" y="100" font-size="11" fill="#475569">HTTP :3000</text>

  <!-- Docker Compose boundary -->
  <rect x="40" y="112" width="1120" height="600" rx="10" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="56" y="132" font-size="12" font-weight="600" fill="#0369a1">Docker Compose · red bridge «jokerarena-net»</text>

  <!-- Layer bands -->
  <rect x="60" y="140" width="1080" height="130" rx="6" fill="#eff6ff"/>
  <text x="76" y="162" font-size="12" font-weight="700" fill="#1e3a8a" letter-spacing="1">PRESENTACIÓN</text>
  <rect x="60" y="290" width="1080" height="200" rx="6" fill="#f5f3ff"/>
  <text x="76" y="312" font-size="12" font-weight="700" fill="#4c1d95" letter-spacing="1">LÓGICA</text>
  <rect x="60" y="510" width="1080" height="190" rx="6" fill="#f0fdf4"/>
  <text x="76" y="532" font-size="12" font-weight="700" fill="#14532d" letter-spacing="1">DATOS</text>

  <!-- Frontend -->
  <rect x="450" y="160" width="300" height="90" rx="8" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
  <text x="600" y="180" text-anchor="middle" font-size="11" fill="#64748b">«component» presentación</text>
  <text x="600" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">jokerarena-fe</text>
  <text x="600" y="219" text-anchor="middle" font-size="12" fill="#334155">TypeScript · React · Nginx</text>
  <text x="600" y="238" text-anchor="middle" font-size="11" fill="#64748b">lobby · tapete · consola telemetría · :3000</text>

  <!-- Game engine -->
  <rect x="150" y="340" width="300" height="115" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="300" y="360" text-anchor="middle" font-size="11" fill="#64748b">«component» lógica</text>
  <text x="300" y="381" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">jokerarena-game-ms</text>
  <text x="300" y="400" text-anchor="middle" font-size="12" fill="#334155">Go</text>
  <text x="300" y="419" text-anchor="middle" font-size="11" fill="#64748b">jugadores · salas · bot</text>
  <text x="300" y="435" text-anchor="middle" font-size="11" fill="#64748b">evaluador de manos · pipeline de Jokers</text>
  <text x="300" y="449" text-anchor="middle" font-size="11" fill="#64748b">:8080 (REST + WS)</text>

  <!-- Telemetry -->
  <rect x="750" y="340" width="300" height="115" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="900" y="360" text-anchor="middle" font-size="11" fill="#64748b">«component» lógica</text>
  <text x="900" y="381" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">jokerarena-telemetry-ms</text>
  <text x="900" y="400" text-anchor="middle" font-size="12" fill="#334155">Python · FastAPI</text>
  <text x="900" y="419" text-anchor="middle" font-size="11" fill="#64748b">ingesta de jugadas · historial</text>
  <text x="900" y="435" text-anchor="middle" font-size="11" fill="#64748b">estadísticas · publicación en vivo</text>
  <text x="900" y="449" text-anchor="middle" font-size="11" fill="#64748b">:8000 (REST + SSE) · :50051 (gRPC)</text>

  <!-- PostgreSQL -->
  <path d="M180,548 v110 a120,14 0 0 0 240,0 v-110" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <ellipse cx="300" cy="548" rx="120" ry="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="300" y="586" text-anchor="middle" font-size="11" fill="#64748b">«component» datos · relacional</text>
  <text x="300" y="606" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">jokerarena-game-db</text>
  <text x="300" y="625" text-anchor="middle" font-size="12" fill="#334155">PostgreSQL 16</text>
  <text x="300" y="644" text-anchor="middle" font-size="11" fill="#64748b">players · jokers · matches · match_players</text>

  <!-- MongoDB -->
  <path d="M780,548 v110 a120,14 0 0 0 240,0 v-110" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <ellipse cx="900" cy="548" rx="120" ry="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="900" y="586" text-anchor="middle" font-size="11" fill="#64748b">«component» datos · NoSQL documental</text>
  <text x="900" y="606" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">jokerarena-telemetry-db</text>
  <text x="900" y="625" text-anchor="middle" font-size="12" fill="#334155">MongoDB 7</text>
  <text x="900" y="644" text-anchor="middle" font-size="11" fill="#64748b">hand_events (append-only)</text>

  <!-- C1 REST fe -> game -->
  <line x1="500" y1="250" x2="270" y2="338" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mRest)"/>
  <text x="372" y="288" text-anchor="end" font-size="12" font-weight="600" fill="#1d4ed8">C1 · HTTP REST (JSON)</text>

  <!-- C2 WebSocket fe <-> game -->
  <line x1="562" y1="252" x2="352" y2="338" stroke="#7c3aed" stroke-width="2.2" marker-start="url(#mWs)" marker-end="url(#mWs)"/>
  <text x="468" y="304" font-size="12" font-weight="600" fill="#6d28d9">C2 · WebSocket</text>

  <!-- C3 REST fe -> telemetry -->
  <line x1="640" y1="250" x2="848" y2="338" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mRest)"/>
  <text x="782" y="324" text-anchor="end" font-size="12" font-weight="600" fill="#1d4ed8">C3 · HTTP REST (JSON)</text>

  <!-- C4 SSE telemetry -> fe -->
  <line x1="930" y1="340" x2="702" y2="252" stroke="#ea580c" stroke-width="2.2" marker-end="url(#mSse)"/>
  <text x="826" y="288" font-size="12" font-weight="600" fill="#c2410c">C4 · SSE (text/event-stream)</text>

  <!-- C5 gRPC game -> telemetry -->
  <line x1="450" y1="397" x2="748" y2="397" stroke="#16a34a" stroke-width="2.4" marker-end="url(#mGrpc)"/>
  <text x="600" y="387" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">C5 · gRPC (HTTP/2 + Protobuf)</text>
  <text x="600" y="415" text-anchor="middle" font-size="11" fill="#475569">RecordHand · asíncrono con timeout</text>

  <!-- C6 game -> pg -->
  <line x1="300" y1="455" x2="300" y2="532" stroke="#475569" stroke-width="2.2" marker-end="url(#mDb)"/>
  <text x="312" y="500" font-size="12" font-weight="600" fill="#334155">C6 · PostgreSQL wire (TCP 5432)</text>

  <!-- C7 telemetry -> mongo -->
  <line x1="900" y1="455" x2="900" y2="532" stroke="#475569" stroke-width="2.2" marker-end="url(#mDb)"/>
  <text x="912" y="500" font-size="12" font-weight="600" fill="#334155">C7 · MongoDB wire (TCP 27017)</text>

  <!-- Legend -->
  <rect x="40" y="728" width="1120" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="750" font-size="12" font-weight="700" fill="#0f172a">Convenciones</text>

  <rect x="56" y="762" width="34" height="20" rx="4" fill="#fff" stroke="#6d28d9" stroke-width="2"/>
  <text x="98" y="777" font-size="11" fill="#334155">Componente (contenedor)</text>
  <path d="M60,794 v14 a13,4 0 0 0 26,0 v-14" fill="#fff" stroke="#15803d" stroke-width="1.5"/>
  <ellipse cx="73" cy="794" rx="13" ry="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="98" y="806" font-size="11" fill="#334155">Componente de datos</text>

  <line x1="270" y1="772" x2="310" y2="772" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mRest)"/>
  <text x="318" y="776" font-size="11" fill="#334155">HTTP REST</text>
  <line x1="270" y1="800" x2="310" y2="800" stroke="#7c3aed" stroke-width="2.2" marker-start="url(#mWs)" marker-end="url(#mWs)"/>
  <text x="318" y="804" font-size="11" fill="#334155">WebSocket (bidireccional)</text>

  <line x1="480" y1="772" x2="520" y2="772" stroke="#ea580c" stroke-width="2.2" marker-end="url(#mSse)"/>
  <text x="528" y="776" font-size="11" fill="#334155">SSE (publisher → subscriber)</text>
  <line x1="480" y1="800" x2="520" y2="800" stroke="#16a34a" stroke-width="2.4" marker-end="url(#mGrpc)"/>
  <text x="528" y="804" font-size="11" fill="#334155">gRPC</text>

  <line x1="720" y1="772" x2="760" y2="772" stroke="#475569" stroke-width="2.2" marker-end="url(#mDb)"/>
  <text x="768" y="776" font-size="11" fill="#334155">Protocolo nativo de BD (TCP)</text>
  <rect x="720" y="792" width="40" height="16" rx="3" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="768" y="804" font-size="11" fill="#334155">Frontera de despliegue (Docker)</text>

  <text x="960" y="776" font-size="11" fill="#334155">Flecha: iniciador → receptor</text>
  <text x="960" y="804" font-size="11" fill="#334155">Conectores HTTP: C1–C5</text>
</svg>
