[project]
name = "jokerarena-cli"
version = "2.0.0"
description = "JokerArena P2 - Cliente de terminal (habla solo con el API Gateway)"
requires-python = ">=3.10"
dependencies = [
  "typer==0.15.1",
  "httpx==0.28.1",
  "rich==13.9.4",
  "websockets==14.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
jokerarena = "jokerarena_cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jokerarena_cli"]
