[package]
name = "jokerarena-admin-desktop"
version = "0.1.0"
description = "JokerArena Admin Desktop — Radar NOC y Editor de Reglas LiveOps"
authors = ["Juan David Suárez Coronado"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "jokerarena_admin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri       = { version = "2", features = [] }
tauri-plugin-opener = { version = "2" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true
