# web-ssr (Jose Arturo Herrera Rivera) · incluido desde docker-compose.p2.yml
# En P3: conectado únicamente a edge-net (hacia reverse-proxy y gateway).
# Puerto 3000 publicado temporalmente en el host hasta que se integre el Reverse Proxy de Esteban.
services:
  jokerarena-web-ssr:
    build:
      context: .
      args:
        NEXT_PUBLIC_GATEWAY_WS_URL: ${PUBLIC_GATEWAY_WS_URL:-}
    container_name: jokerarena-web-ssr
    restart: unless-stopped
    environment:
      GATEWAY_INTERNAL_URL: http://jokerarena-gateway:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      jokerarena-gateway:
        condition: service_healthy
    networks:
      - edge-net
