# web-ssr (Jose Arturo Herrera Rivera) · incluido desde docker-compose.p2.yml
# En P3: conectado a edge-net (hacia reverse-proxy) y app-net.
# Puerto 3000 retirado del host (acceso público exclusivo por reverse-proxy en 80/443).
services:
  jokerarena-web-ssr:
    build:
      context: .
      args:
        NEXT_PUBLIC_GATEWAY_WS_URL: ${PUBLIC_GATEWAY_WS_URL:-}
    container_name: jokerarena-web-ssr
    restart: unless-stopped
    environment:
      GATEWAY_INTERNAL_URL: http://jokerarena-gateway:8080
    depends_on:
      jokerarena-gateway:
        condition: service_healthy
    networks:
      - edge-net
      - app-net

networks:
  edge-net:
    name: edge-net
  app-net:
    name: app-net
