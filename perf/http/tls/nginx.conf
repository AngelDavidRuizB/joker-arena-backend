# ==============================================================================
# JokerArena P3 · D2 · Banco de prueba del costo de TLS
#
# Un nginx delante del API Gateway con DOS entradas idénticas:
#   :8081  HTTP/1.1 en claro            (equivale al P2 + un salto de proxy)
#   :8443  HTTPS con HTTP/2 y TLS 1.2/1.3 (mismos parámetros que
#          edge/reverse-proxy/conf.d/10-tls.conf del Escenario 1)
# Como el proxy, el upstream y el keepalive son los mismos, la diferencia de
# latencia entre :8081 y :8443 es el costo de TLS. La diferencia entre el
# gateway directo (:8080) y :8081 es el costo del salto extra del reverse proxy.
# ==============================================================================
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 4096; }

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    access_log off;
    error_log  /dev/stderr warn;
    server_tokens off;

    keepalive_timeout 65;
    keepalive_requests 100000;

    upstream gateway {
        server jokerarena-gateway:8080;
        keepalive 64;
    }

    # Bloque común de proxy (igual en las dos entradas).
    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

    server {
        listen 8081;
        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               HIGH:!aNULL:!MD5:!RC4;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:TLS:10m;
        ssl_session_timeout       10m;
        ssl_session_tickets       off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
