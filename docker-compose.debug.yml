# ==============================================================================
# JokerArena - Modo Depuración Local (Opcional)
# Uso: docker compose -f docker-compose.p2.yml -f docker-compose.debug.yml up -d
# Publica en localhost las interfaces de gestión y las bases de datos para depurar.
#
# En P3 los puertos publicados son solo los del borde (reverse proxy 80/443 y, mientras
# no se integre, el gateway 8080). El cliente web (Next.js SSR) vive en su propio
# repositorio y publica 3000 con su propio compose.yml: aquí no se declara.
# ==============================================================================
name: jokerarena

services:
  jokerarena-neo4j:
    ports:
      - "7474:7474"
      - "7687:7687"

  jokerarena-rabbitmq:
    ports:
      - "15672:15672"

  jokerarena-postgres:
    ports:
      - "5432:5432"

  jokerarena-redis:
    ports:
      - "6379:6379"

  jokerarena-mongo:
    ports:
      - "27017:27017"

  jokerarena-gateway:
    ports:
      - "8080:8080"
