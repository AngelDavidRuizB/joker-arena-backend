# ==============================================================================
# JokerArena P2 · API Gateway (nginx) — punto único de entrada en :8080
# Rutas: contracts/http-routes.md. Las rutas protegidas validan el JWT con una
# subpetición a auth-identity-ms (/auth/verify) antes de enrutar.
# ==============================================================================
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # DNS interno de Docker: los nombres se resuelven en cada petición, así el gateway
    # arranca aunque un servicio todavía no exista y no se queda con IPs viejas.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    log_format gw '$remote_addr "$request" $status $body_bytes_sent ${request_time}s -> $upstream_addr';
    access_log /dev/stdout gw;
    error_log  /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    proxy_connect_timeout 3s;

    # Upgrade a WebSocket solo cuando el cliente lo pide.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # CORS: orígenes permitidos (web SSR y clientes locales).
    map $http_origin $cors_origin {
        default "";
        "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
        "tauri://localhost" $http_origin;
    }

    # Límite de intentos en registro/login (10 por segundo por IP, ráfaga de 20).
    limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=10r/s;

    server {
        listen 8080;
        server_name _;

        set $auth_svc     http://jokerarena-auth-identity-ms:8082;
        set $lobby_svc    http://jokerarena-rooms-lobby-ms:8083;
        set $engine_svc   http://jokerarena-game-engine-ms:8081;
        set $telemetry_svc http://jokerarena-telemetry-ms:8085;
        set $ranking_svc  http://jokerarena-leaderboard-stats-ms:8086;
        set $liveops_svc  http://jokerarena-liveops-rules-ms:8087;
        set $monitor_svc  http://jokerarena-cluster-monitor-ms:8088;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS" always;
        add_header Vary Origin always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        if ($request_method = OPTIONS) { return 204; }

        # Errores del gateway con la forma común {"error","message"}.
        error_page 401 = @unauthorized;
        error_page 403 = @forbidden;
        error_page 502 503 504 = @unavailable;
        location @unauthorized { default_type application/json; return 401 '{"error":"unauthorized","message":"Se requiere un token válido (Authorization: Bearer ... o ?token=)."}'; }
        location @forbidden    { default_type application/json; return 403 '{"error":"forbidden","message":"Esta ruta requiere el rol admin."}'; }
        location @unavailable  { default_type application/json; return 503 '{"error":"service_unavailable","message":"El servicio no está disponible en este momento."}'; }

        # ---- Subpeticiones de autenticación (internas) --------------------------
        location = /_auth {
            internal;
            proxy_pass $auth_svc/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }
        location = /_auth_admin {
            internal;
            proxy_pass $auth_svc/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Required-Role admin;
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # ---- Identidad (pública) -------------------------------------------------
        location ~ ^/api/auth/(register|login|me|logout)$ {
            limit_req zone=auth_rl burst=20 nodelay;
            proxy_pass $auth_svc/auth/$1;
        }

        # ---- Lobby (JWT) ---------------------------------------------------------
        location ~ ^/api/rooms(/.*)?$ {
            auth_request /_auth;
            proxy_pass $lobby_svc/rooms$1$is_args$args;
        }

        # ---- Juego en tiempo real (WebSocket con ?token=; rechaza sesiones cerradas) --
        location ~ ^/ws/([A-Za-z0-9-]+)$ {
            auth_request /_auth;
            proxy_pass $engine_svc/ws/$1$is_args$args;
            proxy_read_timeout 1h;
        }
        location = /api/game/ruleset {
            proxy_pass $engine_svc/ruleset;
        }

        # ---- Telemetría (JWT) ----------------------------------------------------
        location ~ ^/api/telemetry/(.*)$ {
            auth_request /_auth;
            proxy_pass $telemetry_svc/$1$is_args$args;
        }

        # ---- Ranking (público) ---------------------------------------------------
        location ~ ^/api/leaderboard/(.*)$ {
            proxy_pass $ranking_svc/leaderboard/$1$is_args$args;
        }

        # ---- Administración (JWT con rol admin) ----------------------------------
        location ~ ^/admin/liveops/(.*)$ {
            auth_request /_auth_admin;
            proxy_pass $liveops_svc/liveops/$1$is_args$args;
        }
        location ~ ^/admin/cluster/(snapshot|metrics)$ {
            auth_request /_auth_admin;
            proxy_pass $monitor_svc/admin/cluster/$1;
            proxy_read_timeout 1h;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not_found","message":"Ruta no expuesta por el gateway."}';
        }
    }
}
