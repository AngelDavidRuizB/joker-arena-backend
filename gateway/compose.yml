# API Gateway (Esteban Andrés Gómez Álvarez) · incluido desde docker-compose.p2.yml
# En P3: conectado a edge-net (hacia reverse-proxy) y app-net (hacia microservicios).
# Puertos cerrados al host; la entrada externa es el reverse proxy (puertos 80 y 443).
services:
  jokerarena-gateway:
    build: .
    container_name: jokerarena-gateway
    restart: unless-stopped
    networks:
      - edge-net
      - app-net

networks:
  edge-net:
    name: edge-net
  app-net:
    name: app-net
