# API Gateway (Esteban Andrés Gómez Álvarez) · incluido desde docker-compose.p2.yml
services:
  jokerarena-gateway:
    build: .
    container_name: jokerarena-gateway
    restart: unless-stopped
    networks:
      jokerarena-net: {}
      jokerarena-proxy-net:
        ipv4_address: 172.30.253.3
        aliases:
          - jokerarena-gateway-edge

networks:
  jokerarena-net:
    name: jokerarena-net
  jokerarena-proxy-net:
    name: jokerarena-proxy-net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.253.0/24
