# ==============================================================================
# JokerArena: Multiverse Poker Engine - Orquestación Docker Compose
# Infraestructura de datos adoptada del equipo (docker-compose_2.yml):
#   - PostgreSQL 16  -> appdb  / appuser (esquema create_db.sql)
#   - MongoDB 7      -> casino_games / admin (mongo-init.js)
# Todas las credenciales provienen de .env (ignorado por git). Ver .env.example.
# Para usar el servidor remoto compartido, ver .env.remote.example.
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. Base de Datos Relacional: PostgreSQL 16 (Game Engine DB)
  # ----------------------------------------------------------------------------
  jokerarena-game-db:
    image: postgres:16
    container_name: jokerarena-game-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres/create_db.sql:/docker-entrypoint-initdb.d/create_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - jokerarena-net

  # ----------------------------------------------------------------------------
  # 2. Base de Datos NoSQL: MongoDB 7 (Telemetry DB)
  # ----------------------------------------------------------------------------
  jokerarena-telemetry-db:
    image: mongo:7
    container_name: jokerarena-telemetry-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Defina MONGO_ROOT_PASSWORD en .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-casino_games}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
      - ./db/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - jokerarena-net

  # ----------------------------------------------------------------------------
  # 3. Lógica 2: Telemetry & Analytics Service (Python / FastAPI / gRPC)
  # ----------------------------------------------------------------------------
  jokerarena-telemetry-ms:
    build:
      context: ./jokerarena-telemetry-ms
      dockerfile: Dockerfile
    container_name: jokerarena-telemetry-ms
    restart: unless-stopped
    environment:
      HTTP_PORT: 8000
      GRPC_PORT: 50051
      # La contraseña se codifica en código (urllib.parse.quote_plus): admite '@'.
      MONGO_HOST: ${TELEMETRY_MONGO_HOST:-jokerarena-telemetry-db}
      MONGO_PORT: ${TELEMETRY_MONGO_PORT:-27017}
      MONGO_USER: ${TELEMETRY_MONGO_USER:-${MONGO_ROOT_USER:-admin}}
      MONGO_PASSWORD: ${TELEMETRY_MONGO_PASSWORD:-${MONGO_ROOT_PASSWORD}}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
      MONGO_DB: ${MONGO_DB:-casino_games}
    ports:
      - "${TELEMETRY_HTTP_PORT:-8000}:8000"
      - "${TELEMETRY_GRPC_PORT:-50051}:50051"
    depends_on:
      jokerarena-telemetry-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jokerarena-net

  # ----------------------------------------------------------------------------
  # 4. Lógica 1: Game Engine & Session Manager (Go)
  # ----------------------------------------------------------------------------
  jokerarena-game-ms:
    build:
      context: ./jokerarena-game-ms
      dockerfile: Dockerfile
    container_name: jokerarena-game-ms
    restart: unless-stopped
    environment:
      PORT: 8080
      STORAGE_MODE: ${STORAGE_MODE:-postgres}
      # La contraseña se codifica en código (url.UserPassword): admite '@'.
      DB_HOST: ${GAME_DB_HOST:-jokerarena-game-db}
      DB_PORT: ${GAME_DB_PORT:-5432}
      DB_USER: ${GAME_DB_USER:-${POSTGRES_USER:-appuser}}
      DB_PASSWORD: ${GAME_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      DB_NAME: ${GAME_DB_NAME:-${POSTGRES_DB:-appdb}}
      DB_SSLMODE: ${GAME_DB_SSLMODE:-disable}
      TELEMETRY_GRPC_ADDR: ${TELEMETRY_GRPC_ADDR:-jokerarena-telemetry-ms:50051}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - "${GAME_ENGINE_PORT:-8080}:8080"
    depends_on:
      jokerarena-game-db:
        condition: service_healthy
      jokerarena-telemetry-ms:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jokerarena-net

  # ----------------------------------------------------------------------------
  # 5. Presentación: Web Frontend Client (React / TypeScript / Nginx)
  # ----------------------------------------------------------------------------
  jokerarena-fe:
    build:
      context: ./jokerarena-fe
      dockerfile: Dockerfile
    container_name: jokerarena-fe
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      jokerarena-game-ms:
        condition: service_started
      jokerarena-telemetry-ms:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - jokerarena-net

networks:
  jokerarena-net:
    driver: bridge

volumes:
  pgdata:
  mongodata:
