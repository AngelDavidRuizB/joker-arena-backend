<rect width="1400" height="860" fill="#fff"/>
<text x="700" y="32" text-anchor="middle" font-size="22" font-weight="bold">Funcionalidad 4 — Consola de telemetría y auditoría en vivo</text>
<text x="700" y="56" text-anchor="middle" font-size="13" fill="#555">Despacho asíncrono de jugadas, Audit Trail inmutable en MongoDB y streaming SSE del desglose Chips × Mult</text>
<g transform="translate(40,820)" font-size="11"><rect x="0" y="-9" width="10" height="10" fill="#fff" stroke="#222" stroke-width="2"/><text x="16" y="0">Puerto</text>
<line x1="70" y1="-4" x2="110" y2="-4" stroke="#222" stroke-width="2" marker-end="url(#arr)"/><text x="116" y="0">Conector</text>
<line x1="190" y1="-4" x2="230" y2="-4" stroke="#222" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arr)"/><text x="236" y="0">Conector asíncrono / streaming</text></g>
<rect x="40" y="110" width="300" height="199" rx="8" fill="#dbeafe" stroke="#2a5d9f" stroke-width="2"/>
<text x="190.0" y="132" text-anchor="middle" font-size="13">«component»</text>
<text x="190.0" y="152" text-anchor="middle" font-size="16" font-weight="bold">Web Frontend Client</text>
<text x="190.0" y="169" text-anchor="middle" font-size="12">TypeScript / React (:3000)</text>
<text x="54" y="245" font-size="12">• components/TelemetryPanel</text>
<text x="54" y="263" font-size="12">   (desglose Fichas × Multiplicador)</text>
<text x="54" y="281" font-size="12">• hooks/ (suscripción SSE)</text>
<rect x="332" y="172" width="16" height="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="326" y="184" text-anchor="end" font-size="11">p_sse_in</text>
<rect x="520" y="110" width="380" height="199" rx="8" fill="#dcfce7" stroke="#2b7a2b" stroke-width="2"/>
<text x="710.0" y="132" text-anchor="middle" font-size="13">«component»</text>
<text x="710.0" y="152" text-anchor="middle" font-size="16" font-weight="bold">Game Engine &amp; Session Manager</text>
<text x="710.0" y="169" text-anchor="middle" font-size="12">Go (:8080)</text>
<text x="534" y="245" font-size="12">• internal/scoring + jokers — resultado de la mano</text>
<text x="534" y="263" font-size="12">• internal/telemetry — cliente HTTP asíncrono</text>
<text x="534" y="281" font-size="12">   (goroutine, no bloqueante)</text>
<rect x="702.0" y="301" width="16" height="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="724.0" y="301" font-size="11">p_async_dispatch</text>
<rect x="520" y="429" width="380" height="235" rx="8" fill="#dcfce7" stroke="#2b7a2b" stroke-width="2"/>
<text x="710.0" y="451" text-anchor="middle" font-size="13">«component»</text>
<text x="710.0" y="471" text-anchor="middle" font-size="16" font-weight="bold">Telemetry &amp; Analytics Service</text>
<text x="710.0" y="488" text-anchor="middle" font-size="12">Python / FastAPI (:8000)</text>
<text x="534" y="564" font-size="12">• Ruta de ingesta — POST JSON de jugadas</text>
<text x="534" y="582" font-size="12">• Servicio de analítica — eficiencia de descartes,</text>
<text x="534" y="600" font-size="12">   manos recurrentes, multiplicador pico</text>
<text x="534" y="618" font-size="12">• Repositorio Mongo — cliente motor (async)</text>
<text x="534" y="636" font-size="12">• Ruta de streaming — /api/telemetry/stream</text>
<rect x="702.0" y="421" width="16" height="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="724.0" y="447" font-size="11">p_ingest_rest</text>
<rect x="512" y="491" width="16" height="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="534" y="503" font-size="11">p_sse_out</text>
<rect x="892" y="491" width="16" height="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="886" y="503" text-anchor="end" font-size="11">p_mongo_out</text>
<rect x="1090" y="429" width="250" height="181" rx="8" fill="#ffedd5" stroke="#a86a12" stroke-width="2"/>
<text x="1215.0" y="451" text-anchor="middle" font-size="13">«datastore»</text>
<text x="1215.0" y="471" text-anchor="middle" font-size="16" font-weight="bold">MongoDB</text>
<text x="1215.0" y="488" text-anchor="middle" font-size="12">NoSQL documental (:27017)</text>
<text x="1104" y="564" font-size="12">• colección hand_telemetry</text>
<text x="1104" y="582" font-size="12">• Audit Trail Ledger inmutable</text>
<rect x="1082" y="491" width="16" height="16" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="1104" y="503" font-size="11">p_mongo_in</text>
<polyline points="710.0,317 710.0,421" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arr)"/>
<text x="730.0" y="364" text-anchor="start" font-size="12" font-weight="bold" fill="#b00020">C4 · HTTP REST asíncrono</text>
<text x="730.0" y="378" text-anchor="start" font-size="11" fill="#444">sin bloquear el ciclo de juego</text>
<polyline points="908,499 1082,499" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="995.0" y="483" text-anchor="middle" font-size="12" font-weight="bold" fill="#b00020">C6 · MongoDB Wire (BSON)</text>
<text x="995.0" y="497" text-anchor="middle" font-size="11" fill="#444">inserción / consulta de documentos</text>
<polyline points="512,499 430,499 430,180 348,180" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arr)"/>
<text x="415" y="469" text-anchor="end" font-size="12" font-weight="bold" fill="#b00020">C3 · SSE (text/event-stream)</text>
<text x="415" y="483" text-anchor="end" font-size="11" fill="#444">telemetría en vivo (unidireccional)</text>
<rect x="40" y="599" width="440" height="78" fill="#fffde7" stroke="#bba800"/>
<text x="50" y="618" font-size="11.5" font-weight="bold">Flujo (pasos 6-8 de 4.5)</text>
<text x="50" y="634" font-size="11.5">6. C4: el Game Engine despacha la jugada en una goroutine.</text>
<text x="50" y="650" font-size="11.5">7. C6: el servicio persiste el documento y actualiza métricas.</text>
<text x="50" y="666" font-size="11.5">8. C3: emite el evento SSE al panel de telemetría.</text>
</svg>
